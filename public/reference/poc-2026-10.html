    const p0 = or ? 'OR' : LIB_PTS[jeu.pts[0]], p1 = or ? 'OR' : LIB_PTS[jeu.pts[1]];
    texte(p1, cx - 12, y + 6, C.or, 1, 'c', null);
    texte('-', cx, y + 6, C.gris, 1, 'c', null);
    texte(p0, cx + 12, y + 6, C.or, 1, 'c', null);
    // qui sert
    if (jeu.serveur) {
      const sxv = jeu.serveur.eq === 1 ? x + 3 + 4 + largeurTexte(nomG) + 5 : x + lw - 9 - largeurTexte(nomD) - 6;
      px(sxv, y + 7, 3, 3, C.balle); px(sxv - 1, y + 8, 5, 1, C.balle); px(sxv + 1, y + 6, 1, 5, C.balle);
    }
    if (ecranUI === 'jeu') {
      const zp = zonePause();
      px(zp.x - 1, zp.y - 1, zp.w + 2, zp.h + 2, C.contour);
      px(zp.x, zp.y, zp.w, zp.h, '#161b36');
      px(zp.x + 5, zp.y + 3, 2, 8, C.blanc);
      px(zp.x + 9, zp.y + 3, 2, 8, C.blanc);
    }
  }

  function dessineJauge() {
    const hum = jeu.humain;
    if (!hum || jeu.phase !== 'service' || jeu.serveur !== hum || !jeu.pret || !jeu.jauge) return;
    const cx = Math.round(W / 2), y = H - 24;
    const w = 110;
    panneau(cx - w / 2 - 6, y - 7, w + 12, 20);
    const x0 = cx - w / 2, y0 = y;
    const seg = [[0, 0.25, '#c8344a'], [0.25, 0.62, '#d9a52b'], [0.62, 0.82, '#35c47a'], [0.82, 0.93, '#d9a52b'], [0.93, 1, '#c8344a']];
    px(x0 - 1, y0 - 1, w + 2, 8, C.contour);
    for (const [a, b, c] of seg) px(x0 + Math.round(a * w), y0, Math.round((b - a) * w), 6, c);
    const v = jaugeVal(jeu.jauge.t);
    const cxv = x0 + Math.round(v * w);
    px(cxv - 1, y0 - 3, 3, 12, C.contour);
    px(cxv, y0 - 2, 1, 10, C.blanc);
  }

  function libelles() {
    const hum = jeu.humain, b = jeu.balle;
    if (jeu.phase === 'service' && jeu.serveur === hum) return { plat: 'PLAT', coupe: 'COUPE', lobe: '', amorti: '', service: true };
    const haut = b.camp === hum.eq && b.z > HAUT_SMASH && Math.hypot(b.x - hum.x, b.y - hum.y) < 3.5 && jeu.phase === 'jeu';
    return {
      plat: 'FRAPPE', coupe: 'COUPE', lobe: 'LOBE', amorti: 'AMORTI',
      aerien: Math.abs(hum.ey) > 0.4 ? 'VIBORA' : 'BANDEJA', haut,
    };
  }

  function dessineCommandes() {
    const s = jeu.humain;
    if (!s) return;
    const lib = libelles();
    if (!tactile) {
      if (lib.haut) texte('ESPACE : ' + lib.aerien + '   (JOYSTICK HAUT OU BAS : VIBORA)', W / 2, H - 10, C.or, 1, 'c');
      return;
    }
    if (cmd.joy) {
      g.globalAlpha = 0.5;
      anneau(cmd.joy.bx, cmd.joy.by, RAYON_JOY, C.blanc, 1, 2);
      g.globalAlpha = 0.85;
      let dx = cmd.joy.x - cmd.joy.bx, dy = cmd.joy.y - cmd.joy.by;
      const d = Math.hypot(dx, dy);
      if (d > RAYON_JOY) { dx *= RAYON_JOY / d; dy *= RAYON_JOY / d; }
      disque(cmd.joy.bx + dx, cmd.joy.by + dy, 9, C.contour);
      disque(cmd.joy.bx + dx, cmd.joy.by + dy, 8, '#dfe8ff');
      disque(cmd.joy.bx + dx - 2, cmd.joy.by + dy - 2, 3, '#ffffff');
      g.globalAlpha = 1;
    } else if (jeu.temps < 20) {
      g.globalAlpha = 0.28 + 0.12 * Math.sin(jeu.temps * 3);
      anneau(40, H - 40, RAYON_JOY, C.blanc, 1, 2);
      disque(40, H - 40, 8, C.blanc);
      g.globalAlpha = 1;
      texte('BOUGER', 40, H - 13, C.blanc, 1, 'c');
    }
    const z = zones();
    const COUL = {
      plat: ['#ff5470', '#e03a58'], coupe: ['#35c47a', '#24995c'], lobe: ['#3fb4e8', '#2a8fc4'], amorti: ['#2fd0c6', '#1a9d96'],
    };
    const actifs = new Set(Object.values(cmd.ids));
    const bouton_ = (zz, app, haut, bas, nom, clair) => {
      disque(zz.x, zz.y, zz.r, C.contour);
      disque(zz.x, zz.y + (app ? 1 : 0), zz.r - 1, bas);
      if (!app) disque(zz.x, zz.y + 1, zz.r - 3, haut);
      // texte sombre sur les boutons clairs (jaune, orange)
      if (clair) micro(nom, zz.x, zz.y - 2 + (app ? 1 : 0), '#2a1700', 'rgba(255,240,180,0.7)');
      else micro(nom, zz.x, zz.y - 2 + (app ? 1 : 0), C.blanc);
    };
    for (const k of ['plat', 'coupe', 'lobe', 'amorti']) {
      const zz = z[k];
      const app = actifs.has(k);
      const inutile = lib.service && !lib[k];
      const choisi = (s.intent && s.intent.type === k) || (jeu.jauge && jeu.serveur === s && TYPES_SERV[k] === jeu.jauge.type);
      g.globalAlpha = inutile ? 0.25 : app || choisi ? 0.95 : 0.78;
      const c = COUL[k];
      bouton_(zz, app, c[0], c[1], lib[k] || ' ', false);
      if (choisi && s.intent) anneau(zz.x, zz.y, zz.r + 2, C.or, s.charge, 2);
      else if (choisi) anneau(zz.x, zz.y, zz.r + 2, C.blanc, 1, 1);
      g.globalAlpha = 1;
    }
    // le bouton aérien, au centre : n'apparaît qu'avec une balle haute
    if (lib.haut) {
      const zz = z.aerien, app = actifs.has('aerien');
      const vib = lib.aerien === 'VIBORA';
      bouton_(zz, app, vib ? '#b46cff' : '#ffd35c', vib ? '#8a46d6' : '#d9a52b', lib.aerien, !vib);
      effetBouton(vib ? 'vibora' : 'bandeja', zz);
    }
    const zs = z.sprint, on = sprintActif();
    g.globalAlpha = on ? 0.95 : 0.7;
    bouton_(zs, on, on ? '#ffb02e' : '#5a6082', on ? '#d98a10' : '#3a4166', 'COURIR');
    g.globalAlpha = 1;
  }

  // Balle haute : chaque bouton a sa traînée, la même que celle du coup.
  // Víbora : un serpent violet qui ondule ; bandeja : deux plateaux dorés qui
  // tournent à plat.
  function effetBouton(k, zz) {
    const t = jeu.temps;
    const pulse = 0.5 + 0.5 * Math.sin(t * 10);
    g.globalAlpha = 0.35 + 0.4 * pulse;
    anneau(zz.x, zz.y, zz.r + 1, TRAINEES[k], 1, 1);
    if (k === 'vibora') {
      for (let i = 0; i < 14; i++) {
        const a = t * 5 - i * 0.16;
        const r = zz.r + 4 + Math.sin(i * 0.9 + t * 14) * 2;
        g.globalAlpha = (1 - i / 14) * 0.95;
        px(zz.x + Math.cos(a) * r, zz.y + Math.sin(a) * r, 2, 2, i < 2 ? '#f0d8ff' : TRAINEES.vibora);
      }
    } else if (k === 'bandeja') {
      for (const dep of [0, Math.PI]) {
        for (let i = 0; i < 10; i++) {
          const a = t * 3.2 + dep - i * 0.13;
          g.globalAlpha = (1 - i / 10) * 0.95;
          px(zz.x + Math.cos(a) * (zz.r + 5) - 1, zz.y + Math.sin(a) * (zz.r + 3), 3, 1, i < 2 ? '#fff2b0' : TRAINEES.bandeja);
        }
      }
    } else {
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + t * 2;
        const r = zz.r + 3 + ((t * 30 + i * 3) % 6);
        g.globalAlpha = 0.9 - ((t * 30 + i * 3) % 6) / 7;
        px(zz.x + Math.cos(a) * r, zz.y + Math.sin(a) * r, 1, 1, TRAINEES.smash);
      }
    }
    g.globalAlpha = 1;
  }

  function bouton(label, x, y, w, h, act, opts = {}) {
    const base = opts.couleur || '#1f2650';
    px(x - 1, y - 1, w + 2, h + 2, C.contour);
    px(x, y, w, h, base);
    px(x, y, w, 1, opts.clair || '#3a4590');
    px(x, y + h - 2, w, 2, opts.fonce || '#141939');
    texte(label, x + w / 2, y + Math.round((h - 7 * (opts.e || 1)) / 2) - 1, opts.texte || C.blanc, opts.e || 1, 'c');
    boutons.push({ x, y, w, h, act });
  }

  function panneau(x, y, w, h) {
    g.fillStyle = 'rgba(7,9,20,0.78)';
    g.fillRect(x, y, w, h);
    px(x, y, w, 1, '#2a3160'); px(x, y + h - 1, w, 1, '#2a3160');
    px(x, y, 1, h, '#2a3160'); px(x + w - 1, y, 1, h, '#2a3160');
  }

  function dessineMenu() {
    g.fillStyle = 'rgba(7,9,20,0.45)';
    g.fillRect(0, 0, W, H);
    const cx = Math.round(W / 2);
    const t = performance.now() / 1000;
    const titre = 'BANDEJA!';
    const e = W > 300 ? 4 : 3;
    const lw = largeurTexte(titre, e);
    const ox = cx - lw / 2;
    const ty = Math.max(6, Math.round(H * 0.04));
    for (let i = 0; i < titre.length; i++) {
      const dy = Math.round(Math.sin(t * 3 + i * 0.6) * 1.5);
      const col = i < 3 ? EQUIPES[0].maillot : i < 7 ? C.balle : EQUIPES[1].maillot;
      texte(titre[i], ox + i * 6 * e + 2.5 * e, ty + dy, col, e, 'c');
    }
    texte('PADEL ARCADE', cx, ty + 7 * e + 5, C.or, 1, 'c');

    const pw = 196, ph = 91;
    const py = ty + 7 * e + 16;
    panneau(cx - pw / 2, py, pw, ph);
    const lignes = [
      ['NIVEAU', NIVEAUX[pref.niveau].nom, () => { pref.niveau = (pref.niveau + 1) % NIVEAUX.length; sauve(); }],
      ['MATCH', JEUX[pref.jeux] + ' JEUX', () => { pref.jeux = (pref.jeux + 1) % JEUX.length; sauve(); }],
      ['SON', pref.son ? 'OUI' : 'NON', () => { pref.son = !pref.son; Son.muet(!pref.son); sauve(); }],
    ];
    lignes.forEach(([k, v, act], i) => {
      const y = py + 5 + i * 15;
      texte(k, cx - pw / 2 + 10, y + 4, C.gris, 1, 'g');
      bouton('< ' + v + ' >', cx - 14, y, 104, 13, act, { couleur: '#232a58' });
    });
    const jy = py + ph - 29;
    const pulse = Math.sin(t * 5) > 0;
    bouton('JOUER', cx - 50, jy, 100, 24, lanceMatch, { e: 2, couleur: pulse ? '#e63a58' : '#d12f4c', clair: '#ff7a90', fonce: '#8c1b3a' });
    const v = pref.victoires[pref.niveau] || 0, mt = pref.matchs[pref.niveau] || 0;
    const bas_ = py + ph + 5;
    if (bas_ + 8 < H) texte(mt ? `VICTOIRES ${v} / ${mt}` : 'EN DOUBLE : VOUS EN HAUT A DROITE, AVEC UN CPU', cx, bas_, C.gris, 1, 'c');
    if (bas_ + 19 < H) texte(tactile ? 'BOUTONS EN LOSANGE : FRAPPE COUPE LOBE AMORTI' : 'K FRAPPE  J COUPE  L LOBE  I AMORTI  MAJ COURIR', cx, bas_ + 10, '#6f7aa6', 1, 'c');
    if (bas_ + 29 < H) texte('BALLE HAUTE : BANDEJA AU CENTRE, VIBORA JOYSTICK HAUT/BAS', cx, bas_ + 20, '#6f7aa6', 1, 'c');
    if (bas_ + 39 < H) texte('JOYSTICK VERS UNE VITRE A L IMPACT : REBOND CONTRE LA VITRE', cx, bas_ + 30, '#6f7aa6', 1, 'c');
  }

  function dessinePause() {
    g.fillStyle = 'rgba(7,9,20,0.6)'; g.fillRect(0, 0, W, H);
    const cx = Math.round(W / 2), cy = Math.round(H / 2);
    texte('PAUSE', cx, cy - 40, C.blanc, 3, 'c');
    bouton('REPRENDRE', cx - 55, cy - 6, 110, 18, () => pause(false), { couleur: '#1f7fb3', clair: '#6fd0ff', fonce: '#0f4d73' });
    bouton('ABANDONNER', cx - 55, cy + 18, 110, 18, retourMenu);
  }

  function dessineFin() {
    g.fillStyle = 'rgba(7,9,20,0.62)'; g.fillRect(0, 0, W, H);
    const cx = Math.round(W / 2), cy = Math.round(H / 2);
    const gagneM = jeu.jeux[0] > jeu.jeux[1];
    const t = performance.now() / 1000;
    texte(gagneM ? 'VICTOIRE !' : 'DEFAITE', cx, cy - 60 + Math.round(Math.sin(t * 4) * 1.5), gagneM ? C.or : EQUIPES[1].maillot, 3, 'c');
    texte(jeu.jeux[0] + ' - ' + jeu.jeux[1], cx, cy - 32, C.blanc, 2, 'c');
    const st = jeu.stats;
    texte(`COUPS GAGNANTS  ${st.gagnants[0]} - ${st.gagnants[1]}`, cx, cy - 12, C.gris, 1, 'c');
    texte(`POR TRES  ${st.portres[0]} - ${st.portres[1]}`, cx, cy - 2, C.gris, 1, 'c');
    bouton('REJOUER', cx - 108, cy + 12, 100, 20, lanceMatch, { couleur: '#d12f4c', clair: '#ff7a90', fonce: '#8c1b3a' });
    bouton('MENU', cx + 8, cy + 12, 100, 20, retourMenu);
    texte('NIVEAU ' + NIVEAUX[pref.niveau].nom + '   VICTOIRES ' + (pref.victoires[pref.niveau] || 0) + ' / ' + (pref.matchs[pref.niveau] || 0), cx, cy + 42, '#6f7aa6', 1, 'c');
  }

  function dessineBanniere() {
    if (!banniere || ecranUI === 'menu') return;
    const b = banniere;
    const age = b.max - b.vie;
    const e = b.txt.length > 9 ? 2 : 3;
    const entree = Math.min(1, age * 6);
    const cx = Math.round(W / 2), cy = Math.round(K.yF - 10);
    const bandeH = 7 * e + (b.sous ? 18 : 10);
    g.globalAlpha = Math.min(1, b.vie * 3) * 0.75;
    g.fillStyle = '#070914';
    const bw = Math.round(W * entree);
    g.fillRect(cx - bw / 2, cy - 6, bw, bandeH);
    g.fillStyle = b.c;
    g.fillRect(cx - bw / 2, cy - 6, bw, 1);
    g.fillRect(cx - bw / 2, cy - 7 + bandeH, bw, 1);
    g.globalAlpha = Math.min(1, b.vie * 3);
    const dx = Math.round((1 - entree) * 60);
    texte(b.txt, cx - dx, cy, b.c, e, 'c');
    if (b.sous) texte(b.sous, cx + dx, cy + 7 * e + 4, C.blanc, 1, 'c');
    g.globalAlpha = 1;
  }

  function dessinePortrait() {
    g.fillStyle = C.nuit; g.fillRect(0, 0, W, H);
    const cx = Math.round(W / 2), cy = Math.round(H / 2);
    const t = performance.now() / 1000;
    const a = (Math.sin(t * 2) * 0.5 + 0.5) * Math.PI / 2;
    g.save();
    g.translate(cx, cy - 30);
    g.rotate(-a);
    g.fillStyle = C.contour; g.fillRect(-15, -26, 30, 52);
    g.fillStyle = '#b6c2e0'; g.fillRect(-14, -25, 28, 50);
    g.fillStyle = '#2459ad'; g.fillRect(-12, -21, 24, 40);
    g.fillStyle = '#eef3ff'; g.fillRect(-12, -1, 24, 1);
    g.fillStyle = '#c9cfe0'; g.fillRect(-1, -21, 2, 40);
    g.restore();
    texte('TOURNEZ', cx, cy + 20, C.blanc, 2, 'c');
    texte('VOTRE TELEPHONE', cx, cy + 40, C.or, 1, 'c');
    texte('LE MATCH SE JOUE', cx, cy + 58, C.gris, 1, 'c');
    texte('EN PAYSAGE', cx, cy + 68, C.gris, 1, 'c');
  }

  function rendu() {
    boutons = [];
    const E = ECHELLE;
    g.setTransform(E, 0, 0, E, 0, 0);
    g.imageSmoothingEnabled = false;
    g.globalAlpha = 1;
    if (portrait) {
      dessinePortrait();
    } else {
      g.fillStyle = C.nuit; g.fillRect(0, 0, W, H);
      const sx = secousse > 0.2 ? Math.round(alea(-secousse, secousse)) : 0;
      const sy = secousse > 0.2 ? Math.round(alea(-secousse, secousse)) : 0;
      g.setTransform(E, 0, 0, E, sx * E, sy * E);
      dessineScene();
      g.setTransform(E, 0, 0, E, 0, 0);
      if (ecranUI !== 'menu') dessineTableau();
      dessineBanniere();
      if (ecranUI === 'jeu') { dessineJauge(); dessineCommandes(); }
      else if (ecranUI === 'menu') dessineMenu();
      else if (ecranUI === 'pause') dessinePause();
      else if (ecranUI === 'fin') dessineFin();
      if (flash > 0) {
        g.fillStyle = `rgba(255,255,255,${flash * 0.5})`;
        g.fillRect(0, 0, W, H);
      }
    }
  }

  /* ============================================== boucle ============ */

  let dernier = performance.now(), cumul = 0;
  function boucle(t) {
    const dt = Math.min(0.05, (t - dernier) / 1000);
    dernier = t;
    if (!portrait && !enPause && ecranUI !== 'fin') {
      cumul += dt;
      while (cumul >= PAS) { pas(PAS); cumul -= PAS; }
    }
    if (!portrait && !enPause) majEffets(dt);
    rendu();
    requestAnimationFrame(boucle);
  }

  window.addEventListener('resize', dispose);
  window.addEventListener('orientationchange', () => setTimeout(dispose, 120));

  dispose();
  if (portrait) {
    const w = W, h = H;
    W = Math.max(w, h); H = Math.min(w, h);
    placeCourt();
    W = w; H = h;
  }
  nouvellePartie('demo');
  requestAnimationFrame(boucle);

  // petit crochet de test : simule une démo accélérée, sans rendu
  window.__padel = {
    simule(secondes) {
      nouvellePartie('demo');
      const compte = { points: 0, coups: 0, raisons: {}, vitres: 0, fautesServ: 0 };
      let n = 0;
      for (let i = 0; i < secondes / PAS; i++) {
        const ph = jeu.phase, fr = jeu.tFrappe;
        pas(PAS);
        if (ph === 'jeu' && jeu.phase === 'point' && banniere) { compte.points++; compte.raisons[banniere.txt] = (compte.raisons[banniere.txt] || 0) + 1; }
        if (jeu.tFrappe < fr) n++;
      }
      compte.coups = n; compte.jeux = [...jeu.jeux]; compte.vitres = jeu.stats.vitres;
      particules = []; bulles = []; banniere = null;
      nouvellePartie('demo');
      return compte;
    },
    etat() { return jeu; },
    interne: { lance, physique, nouvelleBalle, executeCoup, placeService },
  };
})();
</script>
